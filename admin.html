<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>投票結果管理｜偶像股份有限公司</title>

  <link rel="apple-touch-icon" href="assets/團體logo.jpg"><link rel="stylesheet" href="admin.css"></head><body><main><header><a href="index.html">← 返回投票頁</a><div class="brand"><img src="logo-vote.svg" width="44" height="44" alt=""><span>偶像股份有限公司<small>投票結果管理</small></span></div><button id="logout" hidden>登出</button></header><p id="demo-banner" class="banner" hidden>示範資料 · 非實際票數</p><section id="login" class="panel login"><span class="lock" aria-hidden="true">⌑</span><h1>管理員登入</h1><p>限主辦團隊查閱投票結果。</p><p id="setup" hidden>尚未連接管理員設定。請依「後台設定說明.md」完成 Firebase 設定。</p><form id="login-form"><label>電子郵件<input id="email" type="email" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><button id="login-btn" class="primary">登入後台 →</button></form><a class="demo-link" href="admin.html?demo=1">預覽範例圖表 ↗</a></section><p id="status" role="status" aria-live="polite"></p><section id="dashboard" hidden><div class="heading"><div><small>本期指定舞台</small><h1>成員選曲結果</h1></div><button id="refresh">更新結果 ↻</button></div><p id="updated" class="muted"></p><div class="stats"><article class="panel"><span>有效選票</span><strong id="total">—</strong></article><article class="panel"><span>成員選擇</span><strong id="choices">—</strong></article></div><div class="legend"><span><i class="a"></i>Bloody Paradise</span><span><i class="b"></i>Shangri-La</span></div><p class="muted">每張選票包含七位成員各一筆選擇，以下為各成員的得票分布。</p><div id="charts" class="charts"></div><details class="panel records"><summary>逐筆選票 <span id="record-count"></span></summary><div class="table-scroll"><table><thead><tr><th>提交時間</th><th>選票編號</th><th>Bloody Paradise</th><th>Shangri-La</th></tr></thead><tbody id="records"></tbody></table></div><button id="more" hidden>顯示更多</button></details></section><footer>僅供演出編排參考 · 吃冰淇淋不加醬油</footer></main><script src="vote-service.js"></script><script src="admin-config.js"></script><script src="admin-data.js"></script><script src="admin.js"></script></body></html>
